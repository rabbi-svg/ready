<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212B">
<title>Ready</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ready">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
  --paper:   #E9EDEF;
  --surface: #FFFFFF;
  --ink:     #16212B;
  --muted:   #5E717F;
  --faint:   #8B9AA5;
  --rule:    #CBD5DB;
  --sunk:    #DDE3E7;
  --amber:   #B26A00;
  --rust:    #B33A2B;
  --calm:    #2E6E62;
  --shell: 620px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:   #131A20;
    --surface: #1C252C;
    --ink:     #E6ECEF;
    --muted:   #9BAAB4;
    --faint:   #74858F;
    --rule:    #2E3A43;
    --sunk:    #161E24;
    --amber:   #E0A040;
    --rust:    #E27A63;
    --calm:    #6FB3A2;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }

body {
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 3px; }

#app {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  max-width: var(--shell);
  margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
}

header.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 18px;
}

header.bar h1 {
  margin: 0; flex: 1;
  font-size: 17px; font-weight: 650; letter-spacing: -0.015em;
}

.iconbtn {
  min-height: 36px; padding: 0 12px;
  background: none; border: 1px solid var(--rule); border-radius: 5px;
  color: var(--muted); font-size: 13px;
}
.iconbtn[data-busy="1"] { color: var(--calm); border-color: var(--calm); }

/* ---------- capture ---------- */

.capture {
  display: flex; gap: 10px; margin-bottom: 10px;
}

.shoot {
  flex: 1; min-height: 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: var(--ink); color: var(--paper);
  border: 1px solid var(--ink); border-radius: 12px;
  font-size: 15px; font-weight: 600;
}
.shoot .glyph { font-size: 24px; line-height: 1; }
.shoot.second { background: var(--surface); color: var(--ink); border-color: var(--rule); font-weight: 500; }

.typebox { display: flex; gap: 8px; margin-bottom: 22px; }
.typebox input {
  flex: 1; min-width: 0; padding: 12px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  -webkit-appearance: none; appearance: none;
}

/* ---------- waiting ---------- */

.item {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--rule);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
}
.item.asking { border-left-color: var(--amber); }
.item.ready  { border-left-color: var(--calm); }

.item h2 {
  margin: 0 0 4px;
  font-size: 15.5px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em;
}
.item .read { margin: 0 0 12px; font-size: 13.5px; color: var(--muted); }

.q { margin-bottom: 16px; }
.q p { margin: 0 0 7px; font-size: 14.5px; font-weight: 550; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }

.opt {
  padding: 8px 12px;
  background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px;
  font-size: 14px;
}
.opt.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.q input {
  width: 100%; padding: 9px 11px;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
  font-size: 14px;
}

.did { margin: 0 0 12px; padding: 0 0 0 16px; font-size: 14px; color: var(--muted); }
.did li { margin-bottom: 3px; }

.guess {
  margin: 0 0 12px; padding: 9px 11px;
  background: var(--sunk); border: 1px dashed var(--amber); border-radius: 6px;
  font-size: 13px; color: var(--muted);
}

.draft {
  margin-bottom: 10px; padding: 12px;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
}
.draft .to { font-size: 12.5px; color: var(--faint); margin-bottom: 6px; }
.draft .body {
  font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  margin-bottom: 10px;
}

.btn {
  min-height: 44px; padding: 0 16px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 7px;
  font-size: 14.5px; font-weight: 550;
}
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.wide { display: block; width: 100%; }
.btn.small { min-height: 38px; font-size: 13.5px; padding: 0 12px; }
.btn:disabled { opacity: .45; }

.row { display: flex; gap: 8px; }

/* ---------- tasks ---------- */

.tasks { margin-top: 26px; }
.tasks h3 {
  margin: 0 0 8px; font-size: 13px; font-weight: 650;
  color: var(--muted);
}
.task {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 11px 0; border-bottom: 1px solid var(--rule);
  font-size: 14.5px;
}
.task:last-child { border-bottom: 0; }
.task .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.task .when { font-size: 12.5px; color: var(--faint); white-space: nowrap; }
.task.late .when { color: var(--rust); font-weight: 600; }

.tick {
  flex: 0 0 26px; height: 26px; padding: 0;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
  color: var(--calm); font-size: 14px; line-height: 1;
}

.empty { padding: 22px 2px; color: var(--muted); font-size: 15px; max-width: 34ch; }
.empty strong { color: var(--ink); font-weight: 600; }

.warn {
  padding: 11px 13px; margin-bottom: 14px;
  background: var(--surface);
  border: 1px solid var(--rust); border-left: 4px solid var(--rust);
  border-radius: 8px; font-size: 13.5px;
}
.warn code { font-size: 12px; overflow-wrap: anywhere; }

.working {
  padding: 14px; margin-bottom: 12px;
  background: var(--surface); border: 1px dashed var(--rule); border-radius: 10px;
  font-size: 14px; color: var(--muted);
}

.sheet {
  position: fixed; inset: 0; z-index: 40;
  background: var(--paper); overflow-y: auto;
  padding: max(14px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  max-width: var(--shell); margin: 0 auto;
}
.sheet h2 { margin: 0 0 16px; font-size: 16px; }
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; margin-bottom: 5px; font-size: 13px; color: var(--muted); }
label.field input {
  width: 100%; padding: 11px 12px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
  -webkit-appearance: none; appearance: none;
}

.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom));
  z-index: 60; max-width: calc(var(--shell) - 32px); margin: 0 auto;
  padding: 12px 14px; background: var(--ink); color: var(--paper);
  border-radius: 8px; font-size: 14px;
}
.toast.bad { background: var(--rust); }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <h1>Ready</h1>
    <button class="iconbtn" id="syncBtn">Refresh</button>
    <button class="iconbtn" id="setBtn">Setup</button>
  </header>
  <main id="screen"></main>
</div>

<script>
"use strict";

var APP_VERSION = 'v2.0';

/* ================================================================
   storage
   ================================================================ */

var mem = {};
var persists = (function () {
  try { localStorage.setItem('p', '1'); localStorage.removeItem('p'); return true; }
  catch (e) { return false; }
})();

function rawGet(k) {
  try { return persists ? localStorage.getItem(k) : (mem[k] || null); }
  catch (e) { return mem[k] || null; }
}
function rawSet(k, v) {
  mem[k] = v;
  try { if (persists) localStorage.setItem(k, v); } catch (e) { persists = false; }
}
function jget(k, d) {
  var v = rawGet(k);
  if (!v) return d;
  try { return JSON.parse(v); } catch (e) { return d; }
}
function jset(k, v) { rawSet(k, JSON.stringify(v)); }

function getCfg() { return jget('ready.cfg', null); }
function setCfg(c) { jset('ready.cfg', c); }
function getErrors() { return jget('ready.errors', []); }

function pushError(text) {
  var list = getErrors();
  list.unshift({ at: new Date().toISOString(), text: String(text) });
  jset('ready.errors', list.slice(0, 20));
}

/* ================================================================
   small helpers
   ================================================================ */

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function pad(n) { return n < 10 ? '0' + n : String(n); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return ymd(new Date()); }

function dayGap(a, b) {
  var x = String(a).split('-'), y = String(b).split('-');
  return Math.round((Date.UTC(+y[0], +y[1] - 1, +y[2]) - Date.UTC(+x[0], +x[1] - 1, +x[2])) / 86400000);
}

var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function niceDate(s) {
  if (!s) return '';
  var gap = dayGap(today(), s);
  if (gap === 0) return 'today';
  if (gap === 1) return 'tomorrow';
  if (gap === -1) return 'yesterday';
  if (gap < 0) return Math.abs(gap) + ' days ago';
  var p = String(s).split('-');
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
}

function toast(msg, bad) {
  var old = document.querySelector('.toast');
  if (old) old.remove();
  var el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, bad ? 7000 : 2400);
}

/* ================================================================
   talking to the server
   ================================================================ */

function post(extra) {
  var cfg = getCfg();
  if (!cfg || !cfg.url) return Promise.reject(new Error('Not connected yet'));

  return fetch(cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ token: cfg.token }, extra))
  })
    .then(function (r) { return r.text(); })
    .then(function (text) {
      var res;
      try { res = JSON.parse(text); }
      catch (e) {
        if (String(text).trim().charAt(0) === '<') {
          throw new Error('Got a web page instead of data. Check the address in Setup.');
        }
        throw new Error('The server sent something unreadable.');
      }
      if (!res.ok) throw new Error(res.error || 'The server refused that.');
      return res;
    });
}

/* ================================================================
   state
   ================================================================ */

var asking = [];      // captures waiting on an answer
var ready = [];       // drafts waiting to be copied
var tasks = [];
var answers = {};     // captureId -> array of answers in question order
var working = '';     // text shown while the brain is thinking
var held = null;      // a photo waiting to be told which question it answers
var busy = false;
var lastError = '';

/* ================================================================
   capture
   ================================================================ */

function readAsBase64(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () {
      var s = String(r.result);
      resolve(s.slice(s.indexOf(',') + 1));
    };
    r.onerror = function () { reject(new Error('Could not read that file')); };
    r.readAsDataURL(file);
  });
}

// Phone photos are 3-8MB and base64 adds a third on top. Shrink before
// sending or the request times out somewhere between here and Google.
function shrink(file) {
  if (!/^image\//.test(file.type || '')) {
    if (file.size > 8 * 1024 * 1024) {
      return Promise.reject(new Error('That file is too big to send.'));
    }
    return readAsBase64(file).then(function (b64) {
      return { base64: b64, mime: file.type || 'application/octet-stream', filename: file.name || 'file' };
    });
  }

  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();

    img.onload = function () {
      URL.revokeObjectURL(url);
      try {
        var max = 1600;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = c.toDataURL('image/jpeg', 0.8);
        resolve({
          base64: dataUrl.slice(dataUrl.indexOf(',') + 1),
          mime: 'image/jpeg',
          filename: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg'
        });
      } catch (e) { reject(new Error('Could not process that photo')); }
    };

    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error('That photo could not be read'));
    };
    img.src = url;
  });
}

function sendCapture(payload, label) {
  busy = true;
  working = label;
  render();

  post({ capture: payload })
    .then(function (res) {
      var d = res.data || {};
      if ((d.questions || []).length) {
        asking.unshift({
          id: res.id,
          summary: d.summary || '',
          reading: d.reading || '',
          questions: d.questions
        });
        answers[res.id] = d.questions.map(function () { return ''; });
      } else {
        // Nothing to ask: it has already decided. Pull the result in.
        toast('Done — nothing it needed to ask');
        return refresh(true);
      }
    })
    .catch(function (err) {
      lastError = err.message || String(err);
      pushError('capture: ' + lastError);
      toast(lastError, true);
    })
    .then(function () {
      busy = false;
      working = '';
      render();
    });
}

function capturePhoto(file) {
  shrink(file)
    .then(function (p) {
      // If something is already waiting on an answer, this photo is as likely
      // to be the answer as a new thing. Ask rather than guess.
      if (asking.length) { held = p; render(); return; }
      sendCapture(p, 'Reading the photo...');
    })
    .catch(function (err) { toast(err.message || String(err), true); });
}

function sendHeldAsAnswer(id) {
  var photo = held;
  held = null;
  if (!photo) return;

  busy = true;
  working = 'Reading it...';
  render();

  var mine = answers[id] || [];

  post({ answer: { id: id, answers: mine, base64: photo.base64,
                   mime: photo.mime, filename: photo.filename } })
    .then(function (res) {
      asking = asking.filter(function (a) { return a.id !== id; });
      delete answers[id];
      var d = res.data || {};
      if ((d.drafts || []).length) {
        ready.unshift({ id: id, summary: d.summary || 'Sorted',
                        did: d.did || [], assumed: d.assumed || [], drafts: d.drafts });
      } else { toast('Sorted'); }
      return refresh(true);
    })
    .catch(function (err) {
      lastError = err.message || String(err);
      pushError('answer-photo: ' + lastError);
      toast(lastError, true);
    })
    .then(function () { busy = false; working = ''; render(); });
}

function captureNote(text) {
  sendCapture({ note: text }, 'Thinking...');
}

/* ================================================================
   answering
   ================================================================ */

function submitAnswers(id) {
  var item = null;
  asking.forEach(function (a) { if (a.id === id) item = a; });
  if (!item) return;

  var mine = answers[id] || [];
  var blank = mine.filter(function (a) { return !String(a).trim(); }).length;
  if (blank === mine.length) { toast('Answer at least one', true); return; }

  busy = true;
  working = 'Working on it...';
  render();

  post({ answer: { id: id, answers: mine } })
    .then(function (res) {
      asking = asking.filter(function (a) { return a.id !== id; });
      delete answers[id];
      var d = res.data || {};
      if ((d.drafts || []).length) {
        ready.unshift({
          id: id, summary: item.summary,
          did: d.did || [], assumed: d.assumed || [], drafts: d.drafts
        });
      } else {
        toast('Sorted');
      }
      return refresh(true);
    })
    .catch(function (err) {
      lastError = err.message || String(err);
      pushError('answer: ' + lastError);
      toast(lastError, true);
    })
    .then(function () {
      busy = false;
      working = '';
      render();
    });
}

/* ================================================================
   refresh
   ================================================================ */

function refresh(quiet) {
  var cfg = getCfg();
  if (!cfg || !cfg.url) return Promise.resolve();

  var btn = document.getElementById('syncBtn');
  if (btn) btn.setAttribute('data-busy', '1');

  return Promise.all([
    post({ pending: true }),
    post({})                     // the ordinary sync, for tasks
  ])
    .then(function (both) {
      var p = both[0];
      asking = p.asking || [];
      ready = p.ready || [];
      asking.forEach(function (a) {
        if (!answers[a.id]) answers[a.id] = (a.questions || []).map(function () { return ''; });
      });

      var state = both[1].state || {};
      tasks = (state.tasks || []).filter(function (t) {
        return String(t.completed_at || '') === '' && t.archived !== true && t.archived !== 'TRUE';
      });

      lastError = '';
      jset('ready.cache', { asking: asking, ready: ready, tasks: tasks });
    })
    .catch(function (err) {
      lastError = err.message || String(err);
      if (!quiet) toast(lastError, true);
    })
    .then(function () {
      if (btn) btn.removeAttribute('data-busy');
      render();
    });
}

function completeTask(id) {
  tasks = tasks.filter(function (t) { return String(t.id) !== String(id); });
  render();
  post({ mutations: [{ mid: uuid(), op: 'completeTask', data: { id: id } }] })
    .catch(function (err) { toast(err.message || String(err), true); });
}

function dismiss(id) {
  ready = ready.filter(function (r) { return r.id !== id; });
  render();
  post({ archive_capture: { id: id } })
    .catch(function (err) { toast(err.message || String(err), true); });
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

/* ================================================================
   drawing
   ================================================================ */

var showSetup = false;

function render() {
  if (showSetup) { document.getElementById('screen').innerHTML = setupScreen(); return; }
  if (!getCfg()) { document.getElementById('screen').innerHTML = gateScreen(); return; }

  var html = '';

  if (lastError) html += '<div class="warn">' + esc(lastError) + '</div>';
  if (!persists) {
    html += '<div class="warn">This browser will not let the app remember your ' +
      'settings, so you may have to enter them again.</div>';
  }

  html += '<div class="capture">' +
      '<label class="shoot">' +
        '<span class="glyph">&#9673;</span><span>Snap something</span>' +
        '<input type="file" accept="image/*" capture="environment" data-shot hidden>' +
      '</label>' +
      '<label class="shoot second" style="flex:0 0 96px">' +
        '<span class="glyph">&#8862;</span><span>Pick a file</span>' +
        '<input type="file" data-shot hidden>' +
      '</label>' +
    '</div>' +
    '<div class="typebox">' +
      '<input type="text" id="noteBox" placeholder="or just type it" ' +
        (busy ? 'disabled' : '') + '>' +
      '<button class="btn" data-act="note"' + (busy ? ' disabled' : '') + '>Send</button>' +
    '</div>';

  if (held) {
    html += '<div class="item asking">' +
      '<h2>What is this photo for?</h2>' +
      '<p class="read">Something is still waiting on an answer, so I am not ' +
        'assuming either way.</p>' +
      asking.map(function (a) {
        return '<button class="btn wide" data-act="held-for" data-id="' + esc(a.id) + '" ' +
          'style="margin-bottom:8px;text-align:left">' + esc(a.summary) + '</button>';
      }).join('') +
      '<button class="btn primary wide" data-act="held-new">It is something new</button>' +
      '<button class="btn wide" data-act="held-drop" style="margin-top:8px">Forget it</button>' +
    '</div>';
  }

  if (working) html += '<div class="working">' + esc(working) + '</div>';

  asking.forEach(function (a) { html += askingCard(a); });
  ready.forEach(function (r) { html += readyCard(r); });

  if (!working && !asking.length && !ready.length) {
    html += '<p class="empty"><strong>Nothing waiting.</strong><br>' +
      'Photograph anything that lands on you and it gets dealt with. ' +
      'Letters, bills, cheques, notes to yourself.</p>';
  }

  html += taskList();

  document.getElementById('screen').innerHTML = html;
}

function askingCard(a) {
  var mine = answers[a.id] || [];

  return '<div class="item asking">' +
    '<h2>' + esc(a.summary) + '</h2>' +
    (a.reading ? '<p class="read">' + esc(a.reading) + '</p>' : '') +
    (a.questions || []).map(function (q, i) {
      return '<div class="q">' +
        '<p>' + esc(q.q) + '</p>' +
        '<div class="opts">' +
          (q.options || []).map(function (o) {
            return '<button class="opt' + (mine[i] === o ? ' on' : '') + '" ' +
              'data-act="opt" data-id="' + esc(a.id) + '" data-i="' + i + '" ' +
              'data-v="' + esc(o) + '">' + esc(o) + '</button>';
          }).join('') +
        '</div>' +
        '<input type="text" data-free data-id="' + esc(a.id) + '" data-i="' + i + '" ' +
          'placeholder="or say it your own way" value="' +
          esc((q.options || []).indexOf(mine[i]) === -1 ? (mine[i] || '') : '') + '">' +
      '</div>';
    }).join('') +
    '<button class="btn primary wide" data-act="submit" data-id="' + esc(a.id) + '"' +
      (busy ? ' disabled' : '') + '>Done</button>' +
  '</div>';
}

function readyCard(r) {
  return '<div class="item ready">' +
    '<h2>' + esc(r.summary) + '</h2>' +
    ((r.did || []).length
      ? '<ul class="did">' + r.did.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>'
      : '') +
    ((r.assumed || []).length
      ? '<p class="guess">Assuming: ' + esc(r.assumed.join('; ')) + '</p>'
      : '') +
    (r.actions || []).filter(function (a) { return !a.done; }).map(function (a) {
      return '<div class="draft">' +
        '<div class="to">' + esc(a.kind === 'calendar' ? 'Calendar' : 'Airtable') + '</div>' +
        '<div class="body">' + esc(a.summary) + '</div>' +
        '<button class="btn small primary" data-act="do" data-id="' + esc(r.id) + '" ' +
          'data-i="' + a.index + '">Yes, do it</button>' +
      '</div>';
    }).join('') +
    (r.actions || []).filter(function (a) { return a.done; }).map(function (a) {
      return '<p class="guess">Done: ' + esc(a.summary) + '</p>';
    }).join('') +
    (r.drafts || []).map(function (d, i) {
      return '<div class="draft">' +
        '<div class="to">' + esc(d.channel === 'email' ? 'Email' : 'Text') +
          (d.to ? ' to ' + esc(d.to) : '') +
          (d.subject ? ' — ' + esc(d.subject) : '') + '</div>' +
        '<div class="body" id="d-' + esc(r.id) + '-' + i + '">' + esc(d.body) + '</div>' +
        '<button class="btn small" data-act="copy" data-target="d-' + esc(r.id) + '-' + i + '">' +
          'Copy</button>' +
      '</div>';
    }).join('') +
    '<button class="btn wide" data-act="dismiss" data-id="' + esc(r.id) + '" ' +
      'style="margin-top:4px">Done with this</button>' +
  '</div>';
}

function taskList() {
  if (!tasks.length) return '';

  var sorted = tasks.slice().sort(function (a, b) {
    var ad = String(a.deadline || ''), bd = String(b.deadline || '');
    if (ad !== bd) { if (!ad) return 1; if (!bd) return -1; return ad.localeCompare(bd); }
    return String(a.created_at).localeCompare(String(b.created_at));
  });

  return '<div class="tasks"><h3>Waiting on you</h3>' +
    sorted.map(function (t) {
      var late = t.deadline && dayGap(today(), t.deadline) < 0;
      return '<div class="task' + (late ? ' late' : '') + '">' +
        '<button class="tick" data-act="done" data-id="' + esc(t.id) + '">&#9711;</button>' +
        '<span class="grow">' + esc(t.title) + '</span>' +
        (t.deadline ? '<span class="when">' + esc(niceDate(t.deadline)) + '</span>' : '') +
      '</div>';
    }).join('') +
  '</div>';
}

function gateScreen() {
  return '<p class="empty"><strong>Connect this to your sheet.</strong></p>' +
    '<label class="field"><span>Address</span>' +
      '<input type="url" id="gUrl" placeholder="https://..."></label>' +
    '<label class="field"><span>Token</span>' +
      '<input type="password" id="gToken"></label>' +
    '<button class="btn primary wide" data-act="connect">Connect</button>';
}

function setupScreen() {
  var cfg = getCfg() || {};
  var errors = getErrors();

  return '<div class="sheet">' +
    '<h2>Setup</h2>' +
    '<label class="field"><span>Address</span>' +
      '<input type="url" id="sUrl" value="' + esc(cfg.url || '') + '"></label>' +
    '<label class="field"><span>Token</span>' +
      '<input type="password" id="sToken" value="' + esc(cfg.token || '') + '"></label>' +
    '<button class="btn wide" data-act="save-conn">Save</button>' +
    '<p class="empty" style="padding:14px 0">Version ' + APP_VERSION + '. ' +
      'Stored on this device only.</p>' +
    (errors.length
      ? '<h3 style="font-size:13px;color:var(--muted)">Problems</h3>' +
        errors.slice(0, 8).map(function (e) {
          return '<p class="guess">' + esc(e.text) + '</p>';
        }).join('') +
        '<button class="btn wide" data-act="clear-errors">Clear</button>'
      : '') +
    '<button class="btn wide" data-act="close-setup" style="margin-top:18px">Close</button>' +
  '</div>';
}

/* ================================================================
   events
   ================================================================ */

function val(id) {
  var el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

document.addEventListener('click', function (ev) {
  var btn = ev.target.closest('[data-act]');
  if (!btn) return;
  var act = btn.getAttribute('data-act');
  var id = btn.getAttribute('data-id');

  if (act === 'connect') {
    var u = val('gUrl'), t = val('gToken');
    if (!u || !t) { toast('Both are needed', true); return; }
    setCfg({ url: u, token: t });
    refresh();
    return;
  }

  if (act === 'save-conn') {
    setCfg({ url: val('sUrl'), token: val('sToken') });
    showSetup = false;
    refresh();
    return;
  }

  if (act === 'close-setup') { showSetup = false; render(); return; }
  if (act === 'clear-errors') { jset('ready.errors', []); render(); return; }

  if (act === 'note') {
    var text = val('noteBox');
    if (!text) { toast('Type something first', true); return; }
    captureNote(text);
    return;
  }

  if (act === 'opt') {
    var i = parseInt(btn.getAttribute('data-i'), 10);
    var v = btn.getAttribute('data-v');
    answers[id] = answers[id] || [];
    answers[id][i] = (answers[id][i] === v) ? '' : v;   // tap again to unpick
    render();
    return;
  }

  if (act === 'held-for') { sendHeldAsAnswer(id); return; }

  if (act === 'held-new') {
    var p = held; held = null;
    if (p) sendCapture(p, 'Reading the photo...');
    return;
  }

  if (act === 'held-drop') { held = null; render(); return; }

  if (act === 'submit') { submitAnswers(id); return; }
  if (act === 'do') {
    var i2 = parseInt(btn.getAttribute('data-i'), 10);
    btn.disabled = true;
    btn.textContent = 'Doing it...';
    post({ do_action: { id: id, index: i2 } })
      .then(function (res) {
        toast(res.message || 'Done');
        return refresh(true);
      })
      .catch(function (err) {
        toast(err.message || String(err), true);
        render();
      });
    return;
  }

  if (act === 'dismiss') { dismiss(id); return; }
  if (act === 'done') { completeTask(id); return; }

  if (act === 'copy') {
    var el = document.getElementById(btn.getAttribute('data-target'));
    if (!el) return;
    var text2 = el.textContent;

    function fallback() {
      // Older iOS refuses the clipboard API outside a few contexts.
      var ta = document.createElement('textarea');
      ta.value = text2;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('Copied'); }
      catch (e) { toast('Could not copy — select the text instead', true); }
      ta.remove();
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text2).then(function () { toast('Copied'); }, fallback);
    } else { fallback(); }
    return;
  }
});

document.addEventListener('change', function (ev) {
  if (ev.target && ev.target.hasAttribute && ev.target.hasAttribute('data-shot')) {
    var file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (file) capturePhoto(file);
  }
});

// Typed answers are kept as you go, but never trigger a redraw: rebuilding
// the card under your fingers is what made the old app feel broken.
document.addEventListener('input', function (ev) {
  if (ev.target && ev.target.hasAttribute && ev.target.hasAttribute('data-free')) {
    var id = ev.target.getAttribute('data-id');
    var i = parseInt(ev.target.getAttribute('data-i'), 10);
    answers[id] = answers[id] || [];
    answers[id][i] = ev.target.value;
  }
});

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'noteBox') {
    ev.preventDefault();
    var b = document.querySelector('[data-act="note"]');
    if (b) b.click();
  }
});

document.getElementById('syncBtn').addEventListener('click', function () { refresh(); });
document.getElementById('setBtn').addEventListener('click', function () {
  showSetup = !showSetup;
  render();
});

window.addEventListener('error', function (ev) {
  pushError('error: ' + String((ev.error && ev.error.message) || ev.message));
});
window.addEventListener('unhandledrejection', function (ev) {
  pushError('promise: ' + String((ev.reason && ev.reason.message) || ev.reason));
});

/* ================================================================
   start
   ================================================================ */

function registerWorker() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

(function boot() {
  var cached = jget('ready.cache', null);
  if (cached) {
    asking = cached.asking || [];
    ready = cached.ready || [];
    tasks = cached.tasks || [];
    asking.forEach(function (a) {
      if (!answers[a.id]) answers[a.id] = (a.questions || []).map(function () { return ''; });
    });
  }
  render();
  refresh(true);
  registerWorker();
})();
</script>
</body>
</html>
